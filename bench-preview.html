<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>preview bench</title></head>
  <body>
    <pre id="out">running…</pre>
    <canvas id="onscreen" width="3200" height="2400" style="width:320px;height:240px"></canvas>
    <script type="module">
      import { generateCells } from "/src/generator.js";

      const out = document.querySelector("#out");
      const log = (l) => { out.textContent += "\n" + l; console.log(l); };
      const t = async (label, fn) => {
        const t0 = performance.now();
        const v = await fn();
        log(`${(performance.now() - t0).toFixed(0).padStart(7)}ms  ${label}`);
        return v;
      };

      const seed = 760487397;
      const cells = await t("generate cells", () => generateCells(seed));

      // Compose the full 12800x9600 map exactly as the renderer does, so the
      // measurements below start from a realistic canvas.
      const worker = new Worker(new URL("/src/renderer-worker.js", import.meta.url), { type: "module" });
      const composed = await new Promise((resolve) => {
        const t0 = performance.now();
        worker.addEventListener("message", (e) => {
          if (e.data?.type === "preview") { window.__previewAt = performance.now() - t0; }
          if (e.data?.type === "result") resolve({ ...e.data, total: performance.now() - t0 });
        });
        worker.postMessage({ type: "render", cells, cellSize: 100, baseUrl: document.baseURI, seed });
      });
      log(`${window.__previewAt.toFixed(0).padStart(7)}ms  worker: preview ready (current path)`);
      log(`${composed.total.toFixed(0).padStart(7)}ms  worker: full result`);

      // Rebuild the big canvas locally to time the individual steps.
      const big = new OffscreenCanvas(12800, 9600);
      const bctx = big.getContext("2d", { alpha: false });
      const full = await createImageBitmap(composed.blob);
      await t("draw full image into 12800x9600", async () => bctx.drawImage(full, 0, 0));

      const preview = new OffscreenCanvas(3200, 2400);
      const pctx = preview.getContext("2d", { alpha: false });
      pctx.imageSmoothingEnabled = true;
      pctx.imageSmoothingQuality = "high";
      await t("downscale 12800->3200 (high)", async () => pctx.drawImage(big, 0, 0, 3200, 2400));

      for (const q of [0.88, 0.7, 0.5, 0.3]) {
        const b = await t(`encode preview 3200x2400 q${q}`, () => preview.convertToBlob({ type: "image/webp", quality: q }));
        log(`          -> ${(b.size / 1048576).toFixed(2)} MB`);
      }

      // What it costs to simply show the downscaled pixels instead of encoding.
      const onscreen = document.querySelector("#onscreen");
      const octx = onscreen.getContext("2d", { alpha: false });
      await t("blit downscale straight to an on-screen canvas", async () => {
        octx.drawImage(big, 0, 0, 3200, 2400);
      });
      const bmp = await t("createImageBitmap from big canvas (transfer path)", () => createImageBitmap(big, 0, 0, 12800, 9600, { resizeWidth: 3200, resizeHeight: 2400, resizeQuality: "high" }));
      await t("draw that bitmap on screen", async () => octx.drawImage(bmp, 0, 0));

      full.close(); bmp.close();
      big.width = 1; big.height = 1;
      log("DONE");
      window.__BENCH_DONE = true;
    </script>
  </body>
</html>
